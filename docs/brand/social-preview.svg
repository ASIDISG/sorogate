<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Sorogate: reusable access policies for Stellar, on Soroban. A policy is a list of conditions checked in order; the example stops at the second one and answers Denied with the reason BelowMinimum. Early, Testnet only, not audited.">
  <title>Sorogate: reusable access policies for Stellar, on Soroban</title>
  <rect width="1280" height="640" fill="#121316"/>

  <!-- mark -->
  <g transform="translate(72 72) scale(0.15625)">
    <rect width="512" height="512" rx="112" fill="#0b4fb3"/>
    <path d="M148 400 V236 a108 108 0 0 1 216 0 V400" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="206" y="228" width="100" height="22" rx="11" fill="#ffffff"/>
    <rect x="206" y="282" width="100" height="22" rx="11" fill="#ffffff"/>
    <rect x="206" y="336" width="100" height="22" rx="11" fill="#ffffff"/>
  </g>

  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="72" y="262" font-size="88" font-weight="700" fill="#ececf0">Sorogate</text>
    <text x="72" y="330" font-size="34" fill="#b4b7bf">Reusable access policies</text>
    <text x="72" y="376" font-size="34" fill="#b4b7bf">for Stellar, on Soroban.</text>

    <rect x="72" y="452" width="520" height="52" rx="26" fill="#3a2f10"/>
    <text x="98" y="486" font-size="22" fill="#ffe9a8">Early · Testnet only · Not audited</text>

    <text x="72" y="590" font-size="22" fill="#8a8e99">github.com/Sorogate/sorogate</text>

    <!-- a policy being worked out -->
    <rect x="640" y="88" width="568" height="392" rx="20" fill="#1b1d22" stroke="#50535c" stroke-width="2"/>
    <text x="672" y="134" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="22" fill="#b4b7bf">evaluate(policy, address)</text>

    <!-- 1: holds -->
    <rect x="672" y="160" width="504" height="64" rx="12" fill="#121316" stroke="#50535c" stroke-width="2"/>
    <circle cx="710" cy="192" r="16" fill="#12301d" stroke="#8fd3a4" stroke-width="2"/>
    <path d="M702 192 l6 6 l11 -12" fill="none" stroke="#cdeed8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="742" y="200" font-size="24" fill="#ececf0">Holds ≥ 100 of a token</text>

    <!-- 2: fails -->
    <rect x="672" y="236" width="504" height="64" rx="12" fill="#121316" stroke="#50535c" stroke-width="2"/>
    <circle cx="710" cy="268" r="16" fill="#3a1816" stroke="#e8908a" stroke-width="2"/>
    <path d="M703 261 l14 14 M717 261 l-14 14" fill="none" stroke="#ffd9d6" stroke-width="3.5" stroke-linecap="round"/>
    <text x="742" y="276" font-size="24" fill="#ececf0">Holds ≥ 1 of a collection</text>

    <!-- 3: never reached -->
    <rect x="672" y="312" width="504" height="64" rx="12" fill="#121316" stroke="#50535c" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="710" cy="344" r="16" fill="none" stroke="#8a8e99" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="742" y="341" font-size="22" fill="#8a8e99">Ledger time in a window</text>
    <text x="742" y="364" font-size="16" fill="#8a8e99">not reached: it stops at the first failure</text>

    <!-- the answer -->
    <rect x="672" y="396" width="504" height="64" rx="12" fill="#3a1816"/>
    <text x="700" y="435" font-size="21" font-weight="700" fill="#ffd9d6">Denied: BelowMinimum, condition 2</text>
  </g>
</svg>
