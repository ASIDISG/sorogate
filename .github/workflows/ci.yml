name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Contracts built with soroban-sdk 28 must be built with `stellar contract build`.
      - uses: stellar/stellar-cli@v28.1.0
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: stellar contract build

      # Random differential test: the TypeScript model generates policies and the answers it expects, and the
      # real contract must agree on every one. A failing seed is printed, so it can be reproduced with
      # `npm run generate:random -w @sorogate/sdk -- --seed <seed> --count 1000 --out <dir>`.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract against TypeScript model, random policies
        run: |
          for seed in 1 2 3 "${{ github.run_number }}"; do
            echo "::group::seed $seed"
            npm run generate:random -w @sorogate/sdk -- --seed "$seed" --count 1000 --out "$RUNNER_TEMP/random-$seed"
            SOROGATE_RANDOM_VECTORS="$RUNNER_TEMP/random-$seed" cargo test -p access-policy --test vectors random
            echo "::endgroup::"
          done

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
