name: Pages

# Publishes the playground in packages/site to GitHub Pages. It runs when something the page is built from changes on
# main, or by hand. Pull requests are not built here: the CI workflow already tests and builds the site for them.
on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'packages/sdk/src/**'
      - 'spec/vectors/evaluate.json'
      - 'docs/deployments/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# One deployment at a time; a later one waits instead of cancelling one that is half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The page's examples are the shared vectors; do not publish a build whose examples no longer match them.
      - run: npm test -w @sorogate/site
      - run: npm run build -w @sorogate/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
