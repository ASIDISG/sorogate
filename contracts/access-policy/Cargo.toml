[package]
name = "access-policy"
description = "Stored, owner-controlled access policies that other Soroban contracts can evaluate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Reads the shared test vectors in spec/vectors (tests/vectors.rs).
serde_json = "1"
